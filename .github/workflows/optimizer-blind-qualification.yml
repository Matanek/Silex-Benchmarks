name: Qualify the sealed optimizer corpus

run-name: Qualify optimizer Part 09 (${{ inputs.target }})

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native target or complete admission matrix
        required: true
        type: choice
        default: all
        options:
          - all
          - macos-arm64
          - macos-x64
          - linux-arm64
          - linux-x64
          - windows-arm64
          - windows-x64
          - regex-diagnostic

permissions:
  contents: read

concurrency:
  group: optimizer-blind-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  native:
    if: inputs.target != 'regex-diagnostic'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            zig_archive: zig-aarch64-macos-0.16.0.tar.xz
            zig_sha256: b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489
            zig_directory: zig-aarch64-macos-0.16.0
            performance: true
          - target: macos-x64
            runner: macos-15-intel
            zig_archive: zig-x86_64-macos-0.16.0.tar.xz
            zig_sha256: 0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7
            zig_directory: zig-x86_64-macos-0.16.0
            performance: true
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            zig_archive: zig-aarch64-linux-0.16.0.tar.xz
            zig_sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
            zig_directory: zig-aarch64-linux-0.16.0
            performance: false
          - target: linux-x64
            runner: ubuntu-24.04
            zig_archive: zig-x86_64-linux-0.16.0.tar.xz
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
            zig_directory: zig-x86_64-linux-0.16.0
            performance: false
          - target: windows-x64
            runner: windows-2025
            zig_archive: zig-x86_64-windows-0.16.0.zip
            zig_sha256: 68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e
            zig_directory: zig-x86_64-windows-0.16.0
            performance: false
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    steps:
      - name: Check out the qualification owner
        if: inputs.target == 'all' || inputs.target == matrix.target
        uses: actions/checkout@v6
        with:
          path: Silex-Benchmarks
          fetch-depth: 0

      - name: Install Zig 0.16.0 on Unix
        if: (inputs.target == 'all' || inputs.target == matrix.target) && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/${{ matrix.zig_archive }}"
          curl -fL "https://ziglang.org/download/0.16.0/${{ matrix.zig_archive }}" -o "$archive"
          if command -v sha256sum >/dev/null 2>&1; then
            echo "${{ matrix.zig_sha256 }}  $archive" | sha256sum -c -
          else
            echo "${{ matrix.zig_sha256 }}  $archive" | shasum -a 256 -c -
          fi
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${{ matrix.zig_directory }}" >> "$GITHUB_PATH"

      - name: Install Zig 0.16.0 on Windows
        if: (inputs.target == 'all' || inputs.target == matrix.target) && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "${{ matrix.zig_archive }}"
          Invoke-WebRequest "https://ziglang.org/download/0.16.0/${{ matrix.zig_archive }}" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "${{ matrix.zig_sha256 }}") { throw "Zig archive checksum mismatch" }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH (Join-Path $env:RUNNER_TEMP "${{ matrix.zig_directory }}")

      - name: Install Linux display requirements
        if: (inputs.target == 'all' || inputs.target == matrix.target) && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libvulkan1 libwebkit2gtk-4.1-dev libx11-dev \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers xauth xvfb

      - name: Materialize the sealed closure
        if: inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        run: |
          set -euo pipefail
          baseline=()
          if [ "${{ matrix.performance }}" = "true" ]; then baseline=(--baseline); fi
          python3 -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Workspace.py \
            checkout --workspace . "${baseline[@]}"

      - name: Check out the pinned SDL3 source for unpublished native archives
        if: (inputs.target == 'all' || inputs.target == matrix.target) && (matrix.target == 'macos-x64' || matrix.target == 'linux-arm64' || matrix.performance)
        uses: actions/checkout@v6
        with:
          repository: libsdl-org/SDL
          ref: 8e37db5e797b6167f3a00d697d816a684bd259c7
          path: _SDL
          persist-credentials: false

      - name: Reproduce the unpublished SDL3 native archive
        if: (inputs.target == 'all' || inputs.target == matrix.target) && (matrix.target == 'macos-x64' || matrix.target == 'linux-arm64')
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "macos-x64" ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
            Packages/GFX/Tools/build-sdl3.sh \
              "$GITHUB_WORKSPACE/_SDL" macos-x64 "$RUNNER_TEMP/sdl3"
          else
            docker run --rm --platform linux/arm64 \
              -e RUNNER_TEMP=/runner-temp \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -v "$RUNNER_TEMP:/runner-temp" \
              ubuntu:22.04@sha256:2edbbc5dc405e9612ba3584ce95480277e3eb374407b5505fe26f17df77c7dbc bash -lc '
                set -euo pipefail
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -y
                apt-get install -y \
                  build-essential cmake file git make ninja-build pkg-config \
                  libasound2-dev libaudio-dev libdbus-1-dev libdecor-0-dev \
                  libdrm-dev libegl1-mesa-dev libfribidi-dev libgbm-dev \
                  libgl1-mesa-dev libgles2-mesa-dev libibus-1.0-dev \
                  libjack-dev libpipewire-0.3-dev libpulse-dev libsndio-dev \
                  libthai-dev libudev-dev liburing-dev libusb-1.0-0-dev \
                  libwayland-dev libx11-dev libxext-dev libxcursor-dev \
                  libxfixes-dev libxi-dev libxkbcommon-dev libxrandr-dev \
                  libxss-dev libxtst-dev wayland-protocols
                git config --global --add safe.directory /workspace/_SDL
                /workspace/Packages/GFX/Tools/build-sdl3.sh \
                  /workspace/_SDL linux-arm64 /runner-temp/sdl3
              '
          fi
          archive="SDL3-3.4.10-${{ matrix.target }}.a"
          expected=$(awk -v name="$archive" '$2 == name { print $1 }' \
            Packages/GFX/Boundary/SDL3.SHA256SUMS.txt)
          test -n "$expected"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$RUNNER_TEMP/sdl3/$archive" | cut -d ' ' -f 1)
          else
            actual=$(shasum -a 256 "$RUNNER_TEMP/sdl3/$archive" | cut -d ' ' -f 1)
          fi
          test "$actual" = "$expected"
          mkdir -p "Packages/GFX/Boundary/${{ matrix.target }}"
          cp "$RUNNER_TEMP/sdl3/$archive" \
            "Packages/GFX/Boundary/${{ matrix.target }}/libSDL3.a"

      - name: Build the candidate compiler
        if: inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/candidate" \
            --build-file Silex/Toolchain/build.zig

      - name: Build the Part 07 baseline compiler
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.performance
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/baseline" \
            --build-file _baseline/Silex/Toolchain/build.zig

      - name: Set up and link only the sealed workspace
        if: inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          silex="$RUNNER_TEMP/candidate/bin/silex$suffix"
          "$silex" setup
          python3 -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Workspace.py \
            link --workspace . --silex "$silex" --target "${{ matrix.target }}"

      - name: Prepare the sealed JSON scratch directory
        if: (inputs.target == 'all' || inputs.target == matrix.target) && runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo install -d -m 1777 /private/tmp
          else
            python3 -B -c 'from pathlib import Path; Path("/private/tmp").mkdir(parents=True, exist_ok=True)'
          fi

      - name: Execute the native Debug and Release corpus
        if: inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          command=(python3 -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Campaign.py
            --workspace .
            --silex "$RUNNER_TEMP/candidate/bin/silex$suffix"
            --runner "${{ matrix.runner }}"
            --output "Silex-Benchmarks/Results/OptimizerBlindQualification/${{ matrix.target }}/report.json")
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a "${command[@]}"
          else
            "${command[@]}"
          fi

      - name: Build the external performance oracles
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.performance
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Packages/GFX.Physics/Benchmarks/Oracle2D -B "$RUNNER_TEMP/physics-oracles" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang
          cmake --build "$RUNNER_TEMP/physics-oracles" --config Release --target \
            gfx_physics_contact_kernel_slots \
            gfx_physics_contact_kernel_packed \
            gfx_physics_contact_kernel_reference \
            gfx_physics_integration_kernel_slots \
            gfx_physics_integration_kernel_packed \
            gfx_physics_integration_kernel_reference \
            gfx_physics_preparation_kernel_slots \
            gfx_physics_preparation_kernel_packed \
            gfx_physics_preparation_kernel_reference

      - name: Build the pinned SDL3 SDK for the Boids oracle
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.performance
        shell: bash
        run: |
          set -euo pipefail
          cmake -S _SDL -B "$RUNNER_TEMP/sdl3-sdk-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3-sdk" \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST_LIBRARY=OFF \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/sdl3-sdk-build" --config Release
          cmake --install "$RUNNER_TEMP/sdl3-sdk-build" --config Release

      - name: Validate the package-owned Physics and Boids oracles
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.performance
        shell: bash
        run: |
          set -euo pipefail
          report="Silex-Benchmarks/Results/OptimizerBlindQualification/${{ matrix.target }}"
          python3 -B Packages/GFX.Physics/Benchmarks/Oracle2D/RunContactKernel.py \
            --silex "$report/binaries/physics-contact-release" \
            --clang-slots "$RUNNER_TEMP/physics-oracles/gfx_physics_contact_kernel_slots" \
            --clang-packed "$RUNNER_TEMP/physics-oracles/gfx_physics_contact_kernel_packed" \
            --box2d-check "$RUNNER_TEMP/physics-oracles/gfx_physics_contact_kernel_reference" \
            --check-only
          for stage in integration preparation; do
            python3 -B Packages/GFX.Physics/Benchmarks/Oracle2D/RunStageKernels.py \
              --stage "$stage" \
              --silex "$report/binaries/physics-$stage-release" \
              --clang-slots "$RUNNER_TEMP/physics-oracles/gfx_physics_${stage}_kernel_slots" \
              --clang-packed "$RUNNER_TEMP/physics-oracles/gfx_physics_${stage}_kernel_packed" \
              --box2d-check "$RUNNER_TEMP/physics-oracles/gfx_physics_${stage}_kernel_reference" \
              --check-only
          done
          CMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3-sdk" \
            PATH="$HOME/.silex/toolchain/shadercross/3.0.0/${{ matrix.target }}/bin:$PATH" \
            Silex-Benchmarks/Sources/Boids2D/RunComparison.sh \
            --runs 1 --warmups 0 \
            --silex-compiler "$RUNNER_TEMP/candidate/bin/silex" \
            --build-dir "$RUNNER_TEMP/boids-witnesses" \
            --output "$RUNNER_TEMP/boids-semantic.log"

      - name: Run the physical performance campaign
        if: (inputs.target == 'all' || inputs.target == matrix.target) && matrix.performance
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Performance.py \
            --workspace . \
            --candidate-silex "$RUNNER_TEMP/candidate/bin/silex" \
            --baseline-silex "$RUNNER_TEMP/baseline/bin/silex" \
            --physics-oracle-dir "$RUNNER_TEMP/physics-oracles" \
            --boids-cpp "$RUNNER_TEMP/boids-witnesses/cpp/BoidsCppArchitectural" \
            --report "Silex-Benchmarks/Results/OptimizerBlindQualification/${{ matrix.target }}/report.json"

      - name: Upload the exact native report
        if: always() && (inputs.target == 'all' || inputs.target == matrix.target)
        uses: actions/upload-artifact@v7
        with:
          name: optimizer-blind-${{ matrix.target }}
          path: Silex-Benchmarks/Results/OptimizerBlindQualification/${{ matrix.target }}/report.json
          if-no-files-found: error
          retention-days: 30

  windows-arm64-compiler:
    name: windows-arm64 compiler
    if: inputs.target == 'all' || inputs.target == 'windows-arm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact candidate compiler
        uses: actions/checkout@v6
        with:
          repository: Matanek/Silex
          ref: facb73dbaf75647502fb03301b2d909acdcf6ed5
          path: Silex
      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      - name: Cross-build the compiler executable only
        shell: bash
        run: |
          set -euo pipefail
          zig build -Dtarget=aarch64-windows -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/candidate" \
            --build-file Silex/Toolchain/build.zig
      - uses: actions/upload-artifact@v7
        with:
          name: optimizer-blind-windows-arm64-compiler
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 1

  regex-diagnostic:
    name: regex diagnostic linux-x64
    if: inputs.target == 'regex-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the qualification owner
        uses: actions/checkout@v6
        with:
          path: Silex-Benchmarks
          fetch-depth: 0

      - name: Install Zig 0.16.0
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig.tar.xz"
          curl -fL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$archive"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Materialize the sealed closure
        shell: bash
        run: python3 -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Workspace.py checkout --workspace .

      - name: Build and link the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          zig build -Doptimize=ReleaseFast -Dcpu=baseline \
            --prefix "$RUNNER_TEMP/candidate" \
            --build-file Silex/Toolchain/build.zig
          silex="$RUNNER_TEMP/candidate/bin/silex"
          "$silex" setup
          python3 -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Workspace.py \
            link --workspace . --silex "$silex" --target linux-x64

      - name: Attribute compilation and execution independently
        shell: bash
        run: |
          set -euo pipefail
          python3 -B Silex-Benchmarks/Sources/OptimizerBlindQualification/RegexDiagnostic.py \
            --workspace . \
            --silex "$RUNNER_TEMP/candidate/bin/silex" \
            --source Silex-Benchmarks/Sources/RegexStreamingSearch.sx \
            --timeout 90 \
            --only input-construction \
            --output Silex-Benchmarks/Results/OptimizerBlindQualification/diagnostics/regex-linux-x64.json

      - name: Upload the diagnostic report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optimizer-blind-regex-diagnostic-linux-x64
          path: Silex-Benchmarks/Results/OptimizerBlindQualification/diagnostics/regex-linux-x64.json
          if-no-files-found: error
          retention-days: 30

  windows-arm64:
    name: windows-arm64
    if: inputs.target == 'all' || inputs.target == 'windows-arm64'
    needs: windows-arm64-compiler
    runs-on: windows-11-arm
    timeout-minutes: 180
    steps:
      - name: Check out the qualification owner
        uses: actions/checkout@v6
        with:
          path: Silex-Benchmarks
          fetch-depth: 0
      - name: Materialize the sealed closure
        shell: pwsh
        run: python -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Workspace.py checkout --workspace .
      - uses: actions/download-artifact@v8
        with:
          name: optimizer-blind-windows-arm64-compiler
          path: ${{ runner.temp }}/candidate
      - name: Set up and link only the sealed workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $silex = "$env:RUNNER_TEMP/candidate/bin/silex.exe"
          & $silex setup
          python -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Workspace.py `
            link --workspace . --silex $silex --target windows-arm64
      - name: Prepare the sealed JSON scratch directory
        shell: pwsh
        run: python -B -c 'from pathlib import Path; Path("/private/tmp").mkdir(parents=True, exist_ok=True)'
      - name: Execute the native Debug and Release corpus
        shell: pwsh
        run: |
          python -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Campaign.py `
            --workspace . `
            --silex "$env:RUNNER_TEMP/candidate/bin/silex.exe" `
            --runner windows-11-arm `
            --output Silex-Benchmarks/Results/OptimizerBlindQualification/windows-arm64/report.json
      - name: Upload the exact native report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: optimizer-blind-windows-arm64
          path: Silex-Benchmarks/Results/OptimizerBlindQualification/windows-arm64/report.json
          if-no-files-found: error
          retention-days: 30

  gate:
    name: sealed six-target gate
    if: inputs.target == 'all'
    needs:
      - native
      - windows-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: Silex-Benchmarks
      - uses: actions/download-artifact@v8
        with:
          pattern: optimizer-blind-*
          path: reports
      - name: Apply the blocking Part 09 gate
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reports < <(find reports -name report.json -type f | sort)
          test "${#reports[@]}" -eq 6
          python3 -B Silex-Benchmarks/Sources/OptimizerBlindQualification/Qualification.py \
            gate "${reports[@]}"
